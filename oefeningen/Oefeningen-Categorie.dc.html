<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schaatskompas – Categorie</title>
<script src="../api/app-sync.js"></script>
<script src="../exercise-catalog.js"></script>
<link rel="stylesheet" href="../exercise-pages.css">
<link rel="stylesheet" href="../header-nav.css">
<style>
body{margin:0;background:#F3F6F8;color:#0F1E2E;font-family:Inter,system-ui,sans-serif}
.page{max-width:1120px;margin:0 auto;padding:32px;display:flex;flex-direction:column;gap:20px}
.topbar{background:#0F1E2E;color:#fff;padding:16px 32px}
.topbar-inner{max-width:1120px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:22px}
.brand{font:700 20px 'Space Grotesk',sans-serif;color:#fff;text-decoration:none}
.nav{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.nav a{padding:10px 12px;border-radius:8px;color:#CBD5E1;text-decoration:none;font-size:14px}
.nav a[aria-current=page]{background:#1F3247;color:#fff}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
h1{margin:0;font-size:36px}
.intro{display:flex;flex-direction:column;gap:8px}
.intro p{margin:0;color:#475569;line-height:1.5}
.back{color:#1E40AF}
.sort-control{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px;font-weight:600;color:#334155}
.sort-control select{font:inherit;padding:9px 11px;border:1px solid #94A3B8;border-radius:9px;background:#fff;color:#0F1E2E}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.custom-exercise-card h3{margin:0;font:700 19px 'Space Grotesk',sans-serif}
.custom-exercise-card{background:#fff;border:1px solid #DCE3EA;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.custom-exercise-card p{margin:0;color:#475569;font-size:14px;line-height:1.5}
.custom-exercise-card>a{color:#1E40AF;font-weight:700}
.exercise-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:#64748B}
.exercise-meta span:first-child{padding:4px 8px;border-radius:999px;font-weight:700}
.exercise-media{display:flex;flex-direction:column;gap:6px;font-size:13px}
.exercise-media iframe,.exercise-media video,.exercise-media img{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#EEF2F6;object-fit:contain}
.status{color:#1E3A8A;font-size:14px}
.status.error{color:#9A3412}
</style>
</head>
<body>
<header class="site-header" style="background:#0F1E2E;color:#FFFFFF">
<div style="max-width:1360px;margin:0 auto;padding:16px 32px;display:flex;flex-wrap:wrap;align-items:center;gap:24px">
<div style="display:flex;align-items:center;gap:10px">
<img src="../Schaatscompas%20logo.jpg" alt="" width="40" height="40" style="object-fit:contain;flex:none">
<span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px">Schaatskompas</span>
</div>
<nav aria-label="Hoofdmenu">
<a href="../index.html" style="color:#CBD5E1;text-decoration:none">Seizoen</a>
<a href="../Builder.dc.html" style="color:#CBD5E1;text-decoration:none">Training bouwen</a>
<a href="Oefeningen.dc.html" aria-current="page" style="color:#FFFFFF;text-decoration:none;background:#1F3247;font-weight:600">Oefeningen</a>
<a href="../Groepen.dc.html" style="color:#CBD5E1;text-decoration:none">Mijn groepen</a>
<a href="../Inloggen.dc.html" style="color:#CBD5E1;text-decoration:none">Inloggen</a>
</nav>
<a href="../OpHetIjs.dc.html" style="display:inline-flex;align-items:center;gap:8px;background:#f97415;color:#0F1E2E;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:999px;font-size:15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>Op het ijs</a>
</div>
</header>
<main class="page">
<section class="intro">
<nav aria-label="Kruimelpad"><a class="back" href="Oefeningen.dc.html">Oefeningen</a> › <span id="categoryBreadcrumb">Eigen categorie</span></nav>
<h1 id="categoryTitle">Categorie laden...</h1>
<p>Oefeningen in deze categorie.</p>
</section>
<label class="sort-control" for="exerciseSort">Sorteren op
<select id="exerciseSort">
<option value="date-desc">Datum: nieuwste eerst</option>
<option value="date-asc">Datum: oudste eerst</option>
<option value="name-asc">Alfabet: A–Z</option>
<option value="name-desc">Alfabet: Z–A</option>
</select>
</label>
<p id="categoryStatus" class="status" role="status" aria-live="polite"></p>
<section id="categoryExercises" class="grid" aria-label="Oefeningen in deze categorie"></section>
</main>
<script>
window.SchaatskompasSync.ready.then(function () {
  var api = window.SchaatskompasExerciseCatalog;
  var categoryId = new URLSearchParams(window.location.search).get('id');
  var sortControl = document.getElementById('exerciseSort');
  var title = document.getElementById('categoryTitle');
  var breadcrumb = document.getElementById('categoryBreadcrumb');
  var exerciseList = document.getElementById('categoryExercises');
  var status = document.getElementById('categoryStatus');

  function render() {
    try {
      var catalog = api.load();
      var category = catalog.categories.filter(function (item) { return item.id === categoryId; })[0];
      if (!category) throw new Error('Deze categorie bestaat niet of is niet beschikbaar.');
      var exercises = api.sortItems(catalog.exercises.filter(function (exercise) {
        return exercise.categoryId === category.id;
      }), sortControl.value);
      title.textContent = category.name;
      breadcrumb.textContent = category.name;
      document.title = 'Schaatskompas – ' + category.name;
      exerciseList.innerHTML = exercises.map(function (exercise) {
        return api.renderExerciseCard(Object.assign({}, exercise, { tone: category.tone }), category.name);
      }).join('');
      status.textContent = exercises.length ? '' : 'Er zijn nog geen oefeningen in deze categorie.';
      status.classList.remove('error');
    } catch (error) {
      title.textContent = 'Categorie niet beschikbaar';
      breadcrumb.textContent = 'Categorie niet beschikbaar';
      document.title = 'Schaatskompas – Categorie niet beschikbaar';
      exerciseList.innerHTML = '';
      status.textContent = error.message || 'De categorie kon niet worden geladen.';
      status.classList.add('error');
    }
  }

  sortControl.addEventListener('change', render);
  window.addEventListener('storage', function (event) {
    if (event.key === api.storageKey) render();
  });
  render();
});
</script>
</body>
</html>
